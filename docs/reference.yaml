title: API Documentation Reference
enumerations:
    - name:          BasicType
      description:   An enumeration of basic data types.
      key:           string
      values:
          - value: int
            description: a signed 32-bit integer
          - value: long
            description: a signed 64-bit integer
          - value: float
            description: a floating point number
          - value: double
            description: a double-precision floating point number
          - value: string
            description: a character string
          - value: boolean
            description: a boolean value
          - value: bit
            description: a numeric with valid values of 0 or 1
    - name:          DataType
      description:   An enumeration of data types.
      key:           string
      values:
          - value: int
            description: a signed 32-bit integer
          - value: long
            description: a signed 64-bit integer
          - value: float
            description: a floating point number
          - value: double
            description: a double-precision floating point number
          - value: string
            description: a character string
          - value: boolean
            description: a boolean value
          - value: date
            description: a date (month, day, year)
          - value: array
            description: an array of objects
          - value: object
            description: an object with inline field descriptions
          - value: collection
            description: a collection of items with a key, aka a map
          - value: enum
            description: an enumeration of allowed values
          - value: bitset
            description: a bitset with a list of defined values for the bits used
          - value: bit
            description: a numeric with valid values of 0 or 1
    - name:          KeyType
      description:   An enumeration of types allowed for use as keys.
      key:           string
      values:
          - value: int
            description: a signed 32-bit integer
          - value: long
            description: a signed 64-bit integer
          - value: string
            description: a character string
          - value: enum
            description: an enumeration used as a key
    - name:          FlagType
      description:   The integer storage type used to hold a combined set of bitset flag values.
      key:           string
      values:
          - value: int
            description: a signed 32-bit integer
          - value: long
            description: a signed 64-bit integer
    - name:          HTTPMethod
      description:   The HTTP verb for an API method.
      key:           string
      values:
          - value: GET
          - value: PUT
          - value: POST
          - value: DELETE
          - value: HEAD
          - value: OPTIONS
          - value: TRACE
          - value: CONNECT
data objects:
    - name: Document
      description: The top level node of a documentation YAML file
      fields:
          - name: title
            description: The human-readable title of the API.
            required: no
            type: string
          - name: enumerations
            description: Top-level named enumerations that can be referenced by fields across the document.
            required: no
            type: array
            items:
                typeref: NamedEnumeration
          - name: bitsets
            description: Top-level named bitsets that can be referenced by fields across the document.
            required: no
            type: array
            items:
                typeref: NamedBitSet
          - name: data objects
            description: A list of named, reusable data objects
            required: no
            type: array
            items:
                typeref: DataObject
          - name: service
            description: The service definition containing methods and common definitions, or null if the document only defines shared types.
            required: no
            typeref: Service
    - name: NamedEnumeration
      description: An enumeration that can be referenced by name.
      fields:
          - name: name
            description: The unique identifier for this enumeration, used for type references.
            required: yes
            type: string
          - name: description
            description: Human-readable description of the enumeration's purpose.
            required: no
            type: string
          - name: key
            description: The underlying key type used to represent enum values (e.g., integer or string).
            required: yes
            typeref: KeyType
          - name: values
            description: A list of enumeration values
            required: no
            type: array
            items:
                typeref: EnumConstant
    - name: NamedBitSet
      description: A top-level named bitset that can be referenced by other fields in the document.
                   Each constant represents a single bit flag; all constants must have a longName.
      fields:
          - name: name
            description: The unique identifier for this bitset, used for type references.
            required: yes
            type: string
          - name: description
            description: Human-readable description of the bitset's purpose.
            required: no
            type: string
          - name: key
            description: The underlying integer key type used to store the combined flag value.
            required: yes
            typeref: KeyType
          - name: values
            description: The list of individual flag constants defined for this bitset.
            required: no
            type: array
            items:
                typeref: EnumConstant
    - name: EnumConstant
      description: "An enum constant: a particular value for an enum (also used for bitset)"
      fields:
          - name: value
            description: The key value for this constant. A string is used, which will be parsed to the key type.
            required: yes
            type: string
          - name: longName
            description: A human-readable, alphanumeric name for this constant used in code generation. Should be
                         camelCase. When omitted, value is used in its place for validation purposes.
            required: no
            type: string
          - name: description
            description: The description of this constant
            required: no
            type: string
    - name: DataObject
      description: A description of a named, reusable data object
      fields:
          - name: name
            description: The name of the object
            type: string
          - name: description
            description: A description of the object, it's purpose, etc.
            type: string
          - name: hidden
            description: Allows an object to be hidden in documentation and in generated code. Used if the object is
                         being defined for internal use.
            type: boolean
            default: false
          - name: fields
            description: A list of fields
            type: array
            items:
                typeref: Field
          - name: discriminator
            description: An optional field whose value distinguishes between child types.
            required: no
            typeref: Field
          - name: child types
            description: Optional list of sub-types that extend this object via the discriminator.
            required: no
            type: array
            items:
                typeref: DataObject
          - name: discriminator value
            description: The value of the parent's discriminator field that maps to this child type.
            required: no
            type: string
    - name: Field
      description: A description of a field in an object
      fields:
          - name: name
            description: The short (wire) name of the field as it appears in the JSON payload.
            type: string
          - name: longName
            description: A human-readable, alphanumeric name used for code generation. Must start with a letter and
                         contain only letters, digits, and underscores.
            type: string
          - name: description
            description: A description of the field, it's purpose, etc.
            type: string
          - name: required
            description: An indicator as to whether this field is required or not
            required: no
            default: true
            type: boolean
          - name: default
            description: The default value, if any, for optional fields, when they are not specified.
            required: no
            type: string
          - name: clientDefault
            description: The value that client code should send when the user has not explicitly set this field.
            required: no
            type: string
          - include: TypeSpec
          - name: sampleValues
            description: A list of sample values, if this field type is 'enum', this will be ignored.
            required: no
            type: array
            items:
                type: string
    - name: FieldInclude
      description: Include fields from another type, can be used anywhere 'Field' is used.
      fields:
          - name: include
            description: The type whose fields should be included inline in this location, referencing a named type.
            required: yes
            type: string
          - name: excluding
            description: The fields from the referenced types to exclude, by their 'longName', e.g. "contentId"
            type: array
            items:
                type: string
          - name: overrideRequired
            description: When set, overrides the isRequired value for included fields, except those listed in
                         RequiredOverride.excluding.
            required: no
            typeref: RequiredOverride
    - name: RequiredOverride
      description: Overrides the required state for fields brought in by a FieldInclude element.
      fields:
          - name: required
            description: The required state to apply to included fields.
            required: yes
            type: boolean
          - name: excluding
            description: Long-name paths of included fields that should keep their original required state.
            required: no
            type: array
            items:
                type: string
    - name: TypeSpec
      description: A description of a type
      fields:
          - name: type
            description: The type being described, either this or 'typeref' must be present
            required: no
            typeref: DataType
          - name: parsedAs
            description: Used only when 'type' is 'string'. This field denotes the type that the string should be parsed 
                         to. If the string cannot be parsed to that type a "no-value" fallback will be used instead (i.e.
                         0, false, etc). This option can be used in conjunction with 'interpretedAs'. Setting this field
                         to 'string' is considered an error.
            required: no
            typeref: BasicType
          - name: interpretedAs
            description: How to interpret type being described, for example the 'type' might be string but should be
                         treated as a long.
            required: no
            typeref: BasicType
          - name: typeref
            description: The type being described as a reference to a named type. Either this or 'type' must be present.
            required: no
            type: string
          - name: key
            description: The key if the type is an enum or collection
            required: no
            typeref: KeyType
          - name: flagType
            description: The integer storage type for bitset fields.
            required: no
            typeref: FlagType
          - name: items
            description: The the type of items contained in an array or collection
            required: no
            typeref: TypeSpec
          - name: restrictions
            description: A list of restrictions placed on the value of this type
            required: no
            type: array
            items:
                typeref: Restriction
          - name: fields
            description: A list of fields, required if this type is 'object'
            required: no
            type: array
            items:
                typeref: Field
          - name: values
            description: A list of enum or bitset constants, required if this type is 'enum' or 'bitset'.
            required: no
            type: array
            items:
                typeref: EnumConstant
    - name: Restriction
      description: A restriction on the allowed values
      fields:
          - name: restriction
            description: The description of the restriction. I.e a string field might be restricted to valid BCP-47
                         language tags
            required: yes
            type: string
          - name: value
            description: The single restriction value when multiple values are not needed.
            required: no
            type: string
          - name: values
            description: The list of allowed values when the restriction accepts multiple entries.
            required: no
            type: array
            items:
                type: string
    - name: Service
      description: A description of the service, and the calls that can be made to it
      fields:
          - name: description
            description: A description of the service, it's purpose, etc.
            type: string
          - name: base path
            description: The base URL path prepended to all method paths (e.g., /api/v1).
            required: no
            type: string
          - name: common
            description: A description of common elements to all calls
            required: no
            type: object
            fields:
                - name: headers
                  description: A list of headers
                  type: array
                  items:
                      typeref: Field
                - name: parameters
                  description: A list of query or form parameters
                  type: array
                  items:
                      typeref: Field
                - name: response objects
                  description: Shared data objects used in method responses.
                  type: array
                  items:
                      typeref: DataObject
                - name: enums
                  description: Enumerations scoped to the service.
                  type: array
                  items:
                      typeref: NamedEnumeration
          - name: methods
            description: A description of calls that can be made to the service
            required: no
            type: array
            items:
                typeref: Method
    - name: Method
      description: A call that can be made to the service
      fields:
          - name: method
            description: The HTTP verb used to invoke this endpoint.
            required: no
            typeref: HTTPMethod
          - name: path
            description: The URL path of the endpoint, relative to the service base path. At least one of 'path' or
                         'id' must be present.
            required: no
            type: string
          - name: protocols allowed
            description: The list of allowed protocols (e.g., 'http', 'https').
            required: no
            type: array
            items:
                type: string
          - name: id
            description: An optional numeric identifier for the method. At least one of 'id' or 'path' must be present.
            required: no
            type: int
          - name: name
            description: The name of the method
            type: string
          - name: description
            description: A description of the method
            type: string
          - name: authentication required
            description: Indicates whether authentication is required for this method.
            required: no
            type: boolean
            default: true
          - name: headers
            description: A list of headers
            type: array
            items:
                typeref: Field
          - name: parameters
            description: A list of query or form parameters
            type: array
            items:
                typeref: Field
          - name: request body
            description: Speicifies what are valid request bodies.
            type: object
            fields:
                - name: description
                  description: A description of the request body to be sent
                  type: string
                - name: content types
                  description: 'A list of the accepted content types. See https://www.w3.org/Protocols/rfc1341/4_Content-Type.html'
                  type: array
                  items:
                      type: string
                      restrictions:
                          - restriction: a MIME type
                  sampleValues:
                      - application/JSON
                      - multipart/mixed
          - name: response
            description: A description of the data returned in the response
            required: no
            typeref: Response
          - name: asyncResponse
            description: The eventual async payload returned when the immediate response carries a job ID.
                         Present only when the response has a 'job' field indicating an async result.
                         Uses the same structure as 'response'.
            required: no
            typeref: Response
          - name: successful codes
            description: HTTP status codes that indicate success for this method.
            required: no
            type: array
            items:
                type: string
          - name: failure codes
            description: HTTP status codes that indicate failure for this method.
            required: no
            type: array
            items:
                type: string
    - name: Response
      description: Describes the JSON body returned by the server for a successful API method invocation. Extends TypeSpec.
      fields:
          - name: description
            description: Human-readable description of the response payload.
            required: no
            type: string
          - name: longName
            description: An optional human-readable name used in documentation, e.g. for a scalar
                         'asyncResponse' rendered as a single field row named 'jr'.
            required: no
            type: string
          - name: type
            description: The type of this field, either this or 'typeref' must be present
            required: no
            typeref: DataType
          - name: parsedAs
            description: Used only when 'type' is 'string'. The type the string value should be parsed to;
                         a no-value fallback is used if parsing fails. Setting this to 'string' is an error.
            required: no
            typeref: BasicType
          - name: interpretedAs
            description: An optional type describing how the raw type should be interpreted (e.g., a STRING interpreted as a date).
            required: no
            typeref: BasicType
          - name: typeref
            description: The type of this field, referencing a named type. Either this or 'type' must be present.
            required: no
            type: string
          - name: key
            description: The key if the type is an enum or collection
            required: no
            typeref: KeyType
          - name: flagType
            description: The integer storage type for bitset responses.
            required: no
            typeref: FlagType
          - name: items
            description: The type of items contained in an array or collection
            required: no
            typeref: TypeSpec
          - name: restrictions
            description: A list of restrictions placed on the value of this field
            required: no
            type: array
            items:
                typeref: Restriction
          - name: fields
            description: A list of fields, if this response type is 'object'
            required: no
            type: array
            items:
                typeref: Field
          - name: values
            description: A list of enum or bitset constants, if this response type is 'enum' or 'bitset'
            required: no
            type: array
            items:
                typeref: EnumConstant
